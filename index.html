<!doctype html>
<html lang="en" data-theme="street-royalty">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BookWorm: browse books, read real readers' logs, and keep your own reading library." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>BookWorm</title>
    <script>
      // Apply the saved style mode before first paint so the page never flashes the wrong theme.
      try {
        var mode = localStorage.getItem('bookworm-theme');
        if (mode && /^[a-z-]{3,40}$/.test(mode)) document.documentElement.dataset.theme = mode;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
